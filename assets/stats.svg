<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgGradS" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a0b2e"/>
    <stop offset="100%" stop-color="#2d1247"/>
  </linearGradient>
  <linearGradient id="ringGradS" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="100%" stop-color="#a855f7"/>
  </linearGradient>
  <linearGradient id="barGradS" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="100%" stop-color="#a855f7"/>
  </linearGradient>
  <clipPath id="roundedS"><rect width="495" height="195" rx="16"/></clipPath>
  <style>
    .statRow { opacity:0; animation: rowIn 0.6s ease-out forwards; }
    @keyframes rowIn { 0% {opacity:0; transform:translateX(-14px);} 100% {opacity:1; transform:translateX(0);} }
    .ringSpin { animation: spinIn 1.4s cubic-bezier(.22,.9,.3,1) forwards; }
    @keyframes spinIn { 0% { stroke-dashoffset: 289.03; } 100% { stroke-dashoffset: 92.49; } }
    .rankPulse { animation: rankPulse 2.4s ease-in-out infinite; }
    @keyframes rankPulse { 0%,100% { filter:drop-shadow(0 0 2px #ff6ec7); } 50% { filter:drop-shadow(0 0 7px #ff6ec7); } }
    .titleFade { opacity:0; animation: fadeIn 0.6s ease-out 0.1s forwards; }
    @keyframes fadeIn { to { opacity:1; } }
  </style>
</defs>
<g clip-path="url(#roundedS)">
  <rect width="495" height="195" fill="url(#bgGradS)"/>
  <rect x="0.5" y="0.5" width="494" height="194" rx="15.5" fill="none" stroke="#a855f7" stroke-opacity="0.35"/>

  <text x="20" y="28" class="titleFade" font-family="'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f5eaff">Naveen's GitHub Stats</text>

  <g transform="translate(30,55)">
    
    <g class="statRow" style="animation-delay:0.50s" transform="translate(0,0)">
      <text x="0" y="5" font-family="'Segoe UI',sans-serif" font-size="11.5" fill="#e8d5ff">Total Stars Earned:</text>
      <text x="290" y="5" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#ff9be8">42</text>
      <rect x="150" y="-8" width="150" height="7" rx="3.5" fill="rgba(255,255,255,0.08)"/>
      <rect x="150" y="-8" width="0" height="7" rx="3.5" fill="url(#barGradS)">
        <animate attributeName="width" from="0" to="52.5" dur="1s" begin="1.00s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
      </rect>
    </g>
    <g class="statRow" style="animation-delay:0.65s" transform="translate(0,26)">
      <text x="0" y="5" font-family="'Segoe UI',sans-serif" font-size="11.5" fill="#e8d5ff">Total Commits:</text>
      <text x="290" y="5" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#ff9be8">860</text>
      <rect x="150" y="-8" width="150" height="7" rx="3.5" fill="rgba(255,255,255,0.08)"/>
      <rect x="150" y="-8" width="0" height="7" rx="3.5" fill="url(#barGradS)">
        <animate attributeName="width" from="0" to="64.5" dur="1s" begin="1.15s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
      </rect>
    </g>
    <g class="statRow" style="animation-delay:0.80s" transform="translate(0,52)">
      <text x="0" y="5" font-family="'Segoe UI',sans-serif" font-size="11.5" fill="#e8d5ff">Total PRs:</text>
      <text x="290" y="5" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#ff9be8">38</text>
      <rect x="150" y="-8" width="150" height="7" rx="3.5" fill="rgba(255,255,255,0.08)"/>
      <rect x="150" y="-8" width="0" height="7" rx="3.5" fill="url(#barGradS)">
        <animate attributeName="width" from="0" to="47.5" dur="1s" begin="1.30s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
      </rect>
    </g>
    <g class="statRow" style="animation-delay:0.95s" transform="translate(0,78)">
      <text x="0" y="5" font-family="'Segoe UI',sans-serif" font-size="11.5" fill="#e8d5ff">Total Issues:</text>
      <text x="290" y="5" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#ff9be8">14</text>
      <rect x="150" y="-8" width="150" height="7" rx="3.5" fill="rgba(255,255,255,0.08)"/>
      <rect x="150" y="-8" width="0" height="7" rx="3.5" fill="url(#barGradS)">
        <animate attributeName="width" from="0" to="35.0" dur="1s" begin="1.45s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
      </rect>
    </g>
    <g class="statRow" style="animation-delay:1.10s" transform="translate(0,104)">
      <text x="0" y="5" font-family="'Segoe UI',sans-serif" font-size="11.5" fill="#e8d5ff">Contributed to:</text>
      <text x="290" y="5" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#ff9be8">6</text>
      <rect x="150" y="-8" width="150" height="7" rx="3.5" fill="rgba(255,255,255,0.08)"/>
      <rect x="150" y="-8" width="0" height="7" rx="3.5" fill="url(#barGradS)">
        <animate attributeName="width" from="0" to="30.0" dur="1s" begin="1.60s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
      </rect>
    </g>
  </g>

  <g class="rankPulse" transform="translate(430,97)">
    <circle r="46" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="9"/>
    <circle class="ringSpin" r="46" fill="none" stroke="url(#ringGradS)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="289.03" stroke-dashoffset="289.03"
      transform="rotate(-90)"/>
    <text x="0" y="7" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="22" font-weight="800" fill="#ffffff">B+</text>
  </g>
</g>
</svg>